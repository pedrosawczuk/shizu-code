services:
  postgres:
    image: postgres:17-alpine
    container_name: shizu_code_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shizu_code
    ports:
      - "5436:5432"
    volumes:
      - shizu_code_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shizu_code"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shizu_code_pgdata:
